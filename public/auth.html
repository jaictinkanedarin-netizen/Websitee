<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Access | DeskPro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>DeskPro</h1>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="container" style="max-width: 500px;">
    <h2>Authentication</h2>
    <form id="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" required>
      </div>
      <div class="form-group">
        <label>GCash Number</label>
        <input type="text" id="auth-gcash" placeholder="09XXXXXXXXX">
      </div>
      <button type="button" class="btn-cta" id="btn-login">Login</button>
      <button type="button" class="btn-cta" id="btn-signup" style="background:#0284c7; color:#fff;">Register</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
