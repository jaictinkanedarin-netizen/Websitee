<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICESUPPLY. 🌸 - Account & Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              fredoka: ['Fredoka', 'sans-serif'],
              quicksand: ['Quicksand', 'sans-serif'],
            },
            colors: {
              cute: {
                pink: '#FFAEC9',
                lightpink: '#FFF0F5',
                deeppink: '#FF69B4',
                hotpink: '#FF1493',
                border: '#FFD1DC'
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Fredoka', sans-serif; }
        .floral-bg {
            background-color: #FFF0F5;
            background-image: radial-gradient(#FFAEC9 0.75px, transparent 0.75px), radial-gradient(#FFAEC9 0.75px, #FFF0F5 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
    </style>
</head>
<body class="floral-bg text-slate-800 antialiased flex flex-col min-h-screen items-center p-6">

    <!-- TOP NAVIGATION BAR -->
    <header class="w-full max-w-md bg-white border-4 border-cute-pink rounded-3xl p-4 mb-6 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-heading font-extrabold text-slate-900">🌸 OFFICESUPPLY.</h1>
        <div class="flex items-center gap-2">
            <a href="index.html" class="text-xs font-heading font-bold text-cute-deeppink border-2 border-cute-border px-2.5 py-1.5 rounded-xl hover:bg-cute-lightpink transition flex items-center gap-1">
                🏠 Home
            </a>
            <a href="products.html" class="text-xs font-heading font-bold text-cute-deeppink border-2 border-cute-border px-2.5 py-1.5 rounded-xl hover:bg-cute-lightpink transition flex items-center gap-1">
                🛍️ Products
            </a>
        </div>
    </header>

    <!-- AUTH CARD (LOGIN / SIGN UP) -->
    <div id="auth-card" class="bg-white border-4 border-cute-pink rounded-3xl p-8 max-w-md w-full shadow-lg space-y-6">
        
        <!-- HEADER / TOGGLE TABS -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-heading font-extrabold text-slate-900">🌸 OFFICESUPPLY. ✨</h1>
            <p class="text-xs font-bold text-slate-500">Welcome! Please sign in or create an account.</p>
        </div>

        <div class="flex bg-cute-lightpink p-1 rounded-2xl border-2 border-cute-border">
            <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 rounded-xl font-heading font-bold text-xs bg-cute-deeppink text-white transition">
                Log In
            </button>
            <button id="tab-signup-btn" onclick="switchTab('signup')" class="flex-1 py-2 rounded-xl font-heading font-bold text-xs text-slate-600 transition">
                Sign Up
            </button>
        </div>

        <!-- LOG IN FORM -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="login-email" required placeholder="yourname@cute.com" class="w-full px-4 py-2.5 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <button type="submit" class="w-full bg-cute-deeppink hover:bg-cute-hotpink text-white font-heading font-bold py-3 rounded-2xl transition shadow-md text-sm">
                Log In 🎀
            </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                <input type="text" id="signup-fullname" required placeholder="Sakura Haruno" class="w-full px-4 py-2 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
                <input type="tel" id="signup-phone" placeholder="09123456789" class="w-full px-4 py-2 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="signup-email" required placeholder="yourname@cute.com" class="w-full px-4 py-2 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="signup-password" required placeholder="••••••••" class="w-full px-4 py-2 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <button type="submit" class="w-full bg-cute-deeppink hover:bg-cute-hotpink text-white font-heading font-bold py-3 rounded-2xl transition shadow-md text-sm">
                Create Account 🌸
            </button>
        </form>

    </div>

    <!-- CUSTOMIZE PROFILE SECTION -->
    <div id="profile-section" class="bg-white border-4 border-cute-pink rounded-3xl p-8 max-w-md w-full shadow-lg space-y-6 hidden">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-heading font-extrabold text-slate-900">Customize Profile ✨</h1>
            <p class="text-xs font-bold text-slate-500">Update your account details below</p>
        </div>

        <div class="flex flex-col items-center justify-center space-y-2">
            <img id="avatar-preview" src="https://via.placeholder.com/100" class="w-24 h-24 rounded-full border-4 border-cute-pink object-cover shadow-md">
        </div>

        <form id="profile-form" onsubmit="handleUpdateProfile(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Profile Picture (Drag & Drop or Click)</label>
                <div id="drop-zone" onclick="document.getElementById('profile-file').click()" class="border-2 border-dashed border-cute-pink bg-cute-lightpink rounded-2xl p-4 text-center cursor-pointer hover:bg-white transition">
                    <p class="text-xs font-bold text-cute-deeppink">📸 Drag & drop an image here</p>
                    <p class="text-[10px] text-slate-400 font-medium">or click to browse from device</p>
                    <input type="file" id="profile-file" accept="image/*" class="hidden" onchange="previewFile(this.files[0])">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Display / Full Name</label>
                <input type="text" id="profile-fullname" placeholder="e.g. Cherry Blossom" class="w-full px-4 py-2.5 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
                <input type="tel" id="profile-phone" placeholder="09123456789" class="w-full px-4 py-2.5 rounded-xl border-2 border-cute-border focus:border-cute-deeppink focus:outline-none text-sm font-medium">
            </div>

            <button type="submit" id="save-btn" class="w-full bg-cute-deeppink hover:bg-cute-hotpink text-white font-heading font-bold py-3 rounded-2xl transition shadow-md text-sm">
                Save Profile ✨
            </button>
            <button type="button" onclick="handleLogout()" class="w-full border-2 border-cute-deeppink text-cute-deeppink hover:bg-cute-lightpink font-heading font-bold py-2.5 rounded-2xl transition text-sm">
                Log Out 🚪
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://vlbtdmobfohoonzpflgq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QyXlBe0KPgctz8JrsJ6OKA_Ui1PPgex";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedFile = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkUserSession();
            setupDragAndDrop();
        });

        async function checkUserSession() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const authCard = document.getElementById('auth-card');
            const profileSection = document.getElementById('profile-section');

            // Detect if user clicked "Edit Profile" from the profile page
            const urlParams = new URLSearchParams(window.location.search);
            const isManualEdit = urlParams.get('edit') === 'true';

            if (user) {
                // Redirect saved users directly to profile.html unless explicitly editing
                if (user.user_metadata && user.user_metadata.full_name && !isManualEdit) {
                    window.location.href = 'profile.html';
                    return;
                }

                // Show the customize form for first-time or editing users
                authCard.classList.add('hidden');
                profileSection.classList.remove('hidden');
                
                if (user.user_metadata) {
                    document.getElementById('profile-fullname').value = user.user_metadata.full_name || '';
                    document.getElementById('profile-phone').value = user.user_metadata.phone_number || '';
                    if (user.user_metadata.avatar_url) {
                        document.getElementById('avatar-preview').src = user.user_metadata.avatar_url;
                    }
                }
            } else {
                authCard.classList.remove('hidden');
                profileSection.classList.add('hidden');
            }
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    previewFile(files[0]);
                }
            });
        }

        function previewFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Please select an image file! 🌸');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('avatar-preview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const signupBtn = document.getElementById('tab-signup-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 rounded-xl font-heading font-bold text-xs bg-cute-deeppink text-white transition";
                signupBtn.className = "flex-1 py-2 rounded-xl font-heading font-bold text-xs text-slate-600 transition";
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupBtn.className = "flex-1 py-2 rounded-xl font-heading font-bold text-xs bg-cute-deeppink text-white transition";
                loginBtn.className = "flex-1 py-2 rounded-xl font-heading font-bold text-xs text-slate-600 transition";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Login failed: " + error.message);
            } else {
                alert("Welcome back! 🌸");
                checkUserSession();
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-fullname').value;
            const phone = document.getElementById('signup-phone').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName, phone_number: phone } }
            });

            if (error) {
                alert("Sign Up failed: " + error.message);
            } else {
                alert("Account created successfully! 🌸");
                checkUserSession();
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = 'Saving... 🌸';
            saveBtn.disabled = true;

            const { data: { user } } = await supabaseClient.auth.getUser();
            let avatarUrl = user?.user_metadata?.avatar_url || '';

            // If user dragged a new file, upload to Supabase Storage
            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const filePath = `${user.id}-${Math.random()}.${fileExt}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('avatars')
                    .upload(filePath, selectedFile, { upsert: true });

                if (uploadError) {
                    alert("Image Upload Failed: " + uploadError.message);
                    saveBtn.textContent = 'Save Profile ✨';
                    saveBtn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('avatars')
                    .getPublicUrl(filePath);

                avatarUrl = publicUrlData.publicUrl;
            }

            const fullName = document.getElementById('profile-fullname').value;
            const phone = document.getElementById('profile-phone').value;

            const { error } = await supabaseClient.auth.updateUser({
                data: {
                    full_name: fullName,
                    phone_number: phone,
                    avatar_url: avatarUrl
                }
            });

            saveBtn.textContent = 'Save Profile ✨';
            saveBtn.disabled = false;

            if (error) {
                alert("Profile update failed: " + error.message);
            } else {
                alert("Profile updated successfully! ✨");
                window.location.href = 'profile.html'; // Redirect directly to profile dashboard
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            alert("Logged out successfully! 🌸");
            location.reload();
        }
    </script>
</body>
</html>
