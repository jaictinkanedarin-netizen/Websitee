<script>
async function handleCheckoutFormSubmit(event) {
    event.preventDefault();

    const payButton = document.getElementById('pay-button'); // Ensure your submit button has this ID or update selector
    if (payButton) {
        payButton.disabled = true;
        payButton.textContent = "Connecting to PayMongo... 🌸";
    }

    // Get cart items from localStorage
    const cart = JSON.parse(localStorage.getItem('checkout_items')) || JSON.parse(localStorage.getItem('cart')) || [];

    if (cart.length === 0) {
        alert("Your cart is empty! 🌸");
        if (payButton) payButton.disabled = false;
        return;
    }

    try {
        // Send cart items to your Vercel serverless API
        const response = await fetch('/api/paymongo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: cart })
        });

        const data = await response.json();

        if (data.checkoutUrl) {
            // REDIRECT TO PAYMONGO (GCash, Maya, Cards)
            window.location.href = data.checkoutUrl;
        } else {
            alert(`Payment Error: ${data.error || 'Failed to generate payment link.'}`);
            if (payButton) {
                payButton.disabled = false;
                payButton.textContent = "Pay with PayMongo 💳";
            }
        }
    } catch (error) {
        console.error(error);
        alert("Could not connect to payment server. Please try again! 🌸");
        if (payButton) {
            payButton.disabled = false;
            payButton.textContent = "Pay with PayMongo 💳";
        }
    }
}
</script>
