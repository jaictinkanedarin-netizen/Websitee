<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICESUPPLY. 🌸 - Product Details</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              fredoka: ['Fredoka', 'sans-serif'],
              quicksand: ['Quicksand', 'sans-serif'],
            },
            colors: {
              cute: {
                pink: '#FFAEC9',
                lightpink: '#FFF0F5',
                deeppink: '#FF69B4',
                hotpink: '#FF1493',
                border: '#FFD1DC'
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Fredoka', sans-serif; }
        .floral-bg {
            background-color: #FFF0F5;
            background-image: radial-gradient(#FFAEC9 0.75px, transparent 0.75px), radial-gradient(#FFAEC9 0.75px, #FFF0F5 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
    </style>
</head>
<body class="floral-bg text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-cute-pink text-slate-800 sticky top-0 z-40 shadow-md border-b-4 border-cute-deeppink">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-heading font-extrabold text-white drop-shadow-[0_2px_2px_rgba(255,105,180,0.8)]">
                🌸 OFFICESUPPLY. ✨
            </a>
            <div class="flex gap-2 items-center">
                <button onclick="toggleCartDrawer()" class="bg-white text-cute-deeppink border-2 border-cute-deeppink px-4 py-1.5 rounded-full font-heading font-bold hover:bg-cute-deeppink hover:text-white transition text-xs flex items-center gap-1 shadow-sm">
                    🛒 Cart (<span id="cart-count">0</span>)
                </button>
                <a href="index.html" class="bg-white text-cute-deeppink border-2 border-cute-deeppink px-3 py-1 rounded-full font-heading font-bold text-xs hover:bg-cute-deeppink hover:text-white transition">
                    ← Back to Shop
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN PRODUCT DETAILS -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full space-y-10">
        
        <!-- PRODUCT DISPLAY CARD -->
        <div class="bg-white border-4 border-cute-pink rounded-3xl p-6 sm:p-8 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            
            <!-- IMAGE PREVIEW -->
            <div class="w-full h-80 sm:h-96 rounded-2xl overflow-hidden border-4 border-cute-border bg-cute-lightpink shadow-inner flex items-center justify-center">
                <img id="p-img" src="" alt="Product Image" class="w-full h-full object-cover">
            </div>

            <!-- PRODUCT INFO -->
            <div class="space-y-4">
                <h1 id="p-title" class="text-3xl font-heading font-extrabold text-slate-900">Loading Product...</h1>
                
                <p class="text-xs font-bold text-cute-deeppink flex items-center gap-1">
                    🛍️ Seller: <span id="p-seller" class="text-slate-700">Loading...</span>
                </p>

                <!-- STATS & RATING SUMMARY -->
                <div class="flex flex-wrap items-center gap-4 py-2 border-y-2 border-cute-lightpink">
                    <div class="flex items-center gap-1">
                        <span id="p-rating-stars" class="text-yellow-400 text-lg">⭐⭐⭐⭐⭐</span>
                        <span id="p-rating-num" class="text-xs font-bold text-slate-700">0.0</span>
                    </div>
                    <span class="text-slate-300">|</span>
                    <span id="p-reviews-count" class="text-xs font-bold text-slate-500">0 Reviews</span>
                    <span class="text-slate-300">|</span>
                    <span id="p-sales-count" class="text-xs font-bold text-cute-deeppink bg-cute-lightpink px-2.5 py-1 rounded-full border border-cute-border">0 Bought 📦</span>
                </div>

                <div class="text-2xl font-heading font-extrabold text-slate-900">
                    ₱<span id="p-price">0.00</span>
                </div>

                <div class="space-y-1">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Description 📝</h3>
                    <p id="p-desc" class="text-sm font-medium text-slate-600 leading-relaxed">No description provided.</p>
                </div>

                <div class="pt-4 flex gap-4">
                    <button onclick="addToCart()" class="flex-1 bg-cute-deeppink hover:bg-cute-hotpink text-white font-heading font-bold py-3.5 rounded-2xl shadow-md transition text-center text-sm">
                        Add to Cart 🛒
                    </button>
                </div>
            </div>
        </div>

        <!-- REVIEWS SECTION -->
        <div class="bg-white border-4 border-cute-pink rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            <h2 class="text-2xl font-heading font-extrabold text-slate-900 border-b-2 border-cute-lightpink pb-4">
                Buyer Reviews 🌸
            </h2>

            <!-- ADD REVIEW FORM -->
            <form id="review-form" onsubmit="submitReview(event)" class="bg-cute-lightpink p-4 rounded-2xl border-2 border-cute-border space-y-3">
                <h3 class="text-xs font-bold text-cute-deeppink uppercase">Leave a Review ✨</h3>
                
                <div class="flex items-center gap-3">
                    <label class="text-xs font-bold text-slate-600">Rating:</label>
                    <select id="rev-rating" class="p-2 border-2 border-cute-border rounded-xl text-xs font-bold text-slate-700 bg-white focus:outline-none">
                        <option value="5">⭐⭐⭐⭐⭐ (5 Stars)</option>
                        <option value="4">⭐⭐⭐⭐ (4 Stars)</option>
                        <option value="3">⭐⭐⭐ (3 Stars)</option>
                        <option value="2">⭐⭐ (2 Stars)</option>
                        <option value="1">⭐ (1 Star)</option>
                    </select>
                </div>

                <textarea id="rev-comment" required placeholder="Write your feedback here..." rows="2" class="w-full p-3 border-2 border-cute-border rounded-xl text-sm font-medium focus:outline-none focus:border-cute-deeppink"></textarea>

                <button type="submit" id="btn-submit-review" class="bg-cute-deeppink hover:bg-cute-hotpink text-white font-heading font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                    Post Review 🎀
                </button>
            </form>

            <!-- REVIEWS LIST -->
            <div id="reviews-container" class="space-y-4">
                <p class="text-xs font-bold text-slate-400">Loading reviews...</p>
            </div>
        </div>

    </main>

    <!-- SHOPPING CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl border-l-4 border-cute-pink">
            <div>
                <div class="flex justify-between items-center border-b-2 border-cute-border pb-4">
                    <h3 class="text-2xl font-heading font-extrabold text-slate-900">Your Cart 🛒</h3>
                    <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-slate-600 font-extrabold text-xl">✕</button>
                </div>
                <div id="cart-items" class="py-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
            </div>
            <div class="border-t-2 border-cute-border pt-4 space-y-3">
                <div class="flex justify-between font-heading font-bold text-lg text-slate-900">
                    <span>Total:</span>
                    <span id="cart-total">₱0.00</span>
                </div>
                <button onclick="handleCheckout()" class="w-full bg-cute-deeppink text-white font-heading font-bold py-3.5 rounded-2xl hover:bg-cute-hotpink transition text-base shadow-md">
                    Proceed to Checkout 💳
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t-4 border-cute-pink mt-12 py-6 text-center text-xs font-bold text-slate-500">
        🌸 OFFICESUPPLY. — Cute Korean & Japanese Stationery ✨
    </footer>

    <script>
        const SUPABASE_URL = "https://vlbtdmobfohoonzpflgq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QyXlBe0KPgctz8JrsJ6OKA_Ui1PPgex";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let productId = null;
        let currentUser = null;
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            productId = urlParams.get('id');

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;

            if (!productId) {
                alert("No product selected!");
                window.location.href = 'index.html';
                return;
            }

            updateCartUI();
            loadProductDetails();
            loadReviews();
        });

        function getCartFromStorage() {
            return JSON.parse(localStorage.getItem('cart')) || [];
        }

        function saveCartToStorage(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        async function loadProductDetails() {
            const { data: product, error } = await supabaseClient
                .from('products')
                .select('*')
                .eq('id', productId)
                .single();

            if (error || !product) {
                alert("Product not found!");
                window.location.href = 'index.html';
                return;
            }

            currentProduct = product;

            document.getElementById('p-title').textContent = product.title || 'Untitled Product';
            document.getElementById('p-seller').textContent = product.seller_name || 'OFFICESUPPLY Store';
            document.getElementById('p-price').textContent = parseFloat(product.price || 0).toFixed(2);
            document.getElementById('p-desc').textContent = product.description || 'No description provided.';
            document.getElementById('p-img').src = product.image_url || 'https://via.placeholder.com/400';
            document.getElementById('p-sales-count').textContent = `${product.sales_count || 0} Bought 📦`;
        }

        async function loadReviews() {
            const container = document.getElementById('reviews-container');

            const { data: reviews, error } = await supabaseClient
                .from('reviews')
                .select('*')
                .eq('product_id', productId)
                .order('created_at', { ascending: false });

            if (error || !reviews || reviews.length === 0) {
                container.innerHTML = `<p class="text-xs font-bold text-slate-400">No reviews yet. Be the first to review! 🌸</p>`;
                document.getElementById('p-reviews-count').textContent = `0 Reviews`;
                document.getElementById('p-rating-num').textContent = `0.0`;
                return;
            }

            let totalRating = 0;
            container.innerHTML = reviews.map(rev => {
                totalRating += rev.rating;
                const stars = '⭐'.repeat(rev.rating);
                return `
                    <div class="bg-cute-lightpink/40 border border-cute-border p-4 rounded-2xl space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-800">${rev.user_name || rev.name || 'Anonymous Buyer'}</span>
                            <span class="text-xs">${stars}</span>
                        </div>
                        <p class="text-xs text-slate-600 font-medium">${rev.comment || rev.content || ''}</p>
                    </div>
                `;
            }).join('');

            const avgRating = (totalRating / reviews.length).toFixed(1);
            document.getElementById('p-rating-num').textContent = avgRating;
            document.getElementById('p-reviews-count').textContent = `${reviews.length} Reviews`;
        }

        async function submitReview(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("Please log in to submit a review! 🌸");
                return;
            }

            const btn = document.getElementById('btn-submit-review');
            btn.disabled = true;

            const rating = parseInt(document.getElementById('rev-rating').value, 10);
            const comment = document.getElementById('rev-comment').value;
            const userName = currentUser.user_metadata?.full_name || 'Buyer';

            const { error } = await supabaseClient
                .from('reviews')
                .insert([
                    {
                        product_id: productId,
                        user_id: currentUser.id,
                        user_name: userName,
                        rating: rating,
                        comment: comment
                    }
                ]);

            btn.disabled = false;

            if (error) {
                alert("Failed to submit review: " + error.message);
            } else {
                alert("Review submitted! ✨");
                document.getElementById('rev-comment').value = '';
                loadReviews();
            }
        }

        function addToCart() {
            if (!currentProduct) {
                alert("Product information is still loading!");
                return;
            }

            let cart = getCartFromStorage();
            const existingIndex = cart.findIndex(item => item.id === currentProduct.id);

            if (existingIndex > -1) {
                cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + 1;
            } else {
                cart.push({
                    id: currentProduct.id,
                    title: currentProduct.title,
                    price: currentProduct.price,
                    image_url: currentProduct.image_url,
                    quantity: 1
                });
            }

            saveCartToStorage(cart);
            toggleCartDrawer();
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                updateCartUI();
            }
        }

        function updateCartUI() {
            const cart = getCartFromStorage();
            const totalItems = cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
            
            const badge = document.getElementById('cart-count');
            if (badge) badge.textContent = totalItems;

            const container = document.getElementById('cart-items');
            container.innerHTML = '';

            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-xs font-bold text-slate-400 py-10">Your cart is empty! 🌸</p>`;
            } else {
                cart.forEach((item, index) => {
                    const price = parseFloat(item.price) || 0;
                    const qty = item.quantity || 1;
                    const itemTotal = price * qty;
                    total += itemTotal;

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between bg-cute-lightpink p-3 rounded-2xl border-2 border-cute-border";
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${item.image_url || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-cover rounded-xl border border-cute-border">
                            <div>
                                <p class="font-heading font-bold text-xs text-slate-900">${item.title}</p>
                                <p class="text-xs font-black text-slate-700">₱${price.toFixed(2)} x ${qty}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-xs font-bold text-red-500 hover:text-red-700 p-1">Remove</button>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('cart-total').textContent = `₱${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            let cart = getCartFromStorage();
            cart.splice(index, 1);
            saveCartToStorage(cart);
        }

        async function handleCheckout() {
            const cart = getCartFromStorage();
            if (cart.length === 0) return alert("Your cart is empty! 🌸");

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Please log in or sign up before checking out! 🌸");
                window.location.href = "auth.html";
                return;
            }

            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
