<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICESUPPLY. 🌸 - Pastel Pens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { fredoka: ['Fredoka', 'sans-serif'], quicksand: ['Quicksand', 'sans-serif'] },
            colors: { cute: { pink: '#FFAEC9', lightpink: '#FFF0F5', deeppink: '#FF69B4', hotpink: '#FF1493', border: '#FFD1DC' } }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Fredoka', sans-serif; }
        .floral-bg { background-color: #FFF0F5; background-image: radial-gradient(#FFAEC9 0.75px, transparent 0.75px), radial-gradient(#FFAEC9 0.75px, #FFF0F5 0.75px); background-size: 30px 30px; background-position: 0 0, 15px 15px; }
    </style>
</head>
<body class="floral-bg text-slate-800 antialiased flex flex-col min-h-screen">

    <header class="bg-cute-pink text-slate-800 sticky top-0 z-40 shadow-md border-b-4 border-cute-deeppink">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-heading font-extrabold text-white drop-shadow-[0_2px_2px_rgba(255,105,180,0.8)]">🌸 OFFICESUPPLY. ✨</a>
            <nav class="flex items-center space-x-6 font-bold text-sm">
                <a href="index.html" class="hover:text-white transition">← Back to Home 🌷</a>
                <button onclick="toggleCartDrawer()" class="bg-white text-cute-deeppink border-2 border-cute-deeppink px-4 py-1.5 rounded-full font-heading hover:bg-cute-deeppink hover:text-white transition shadow-sm">🛒 Cart (<span id="cart-count">0</span>)</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 flex-1 w-full space-y-8">
        <div class="text-center space-y-2">
            <span class="bg-white border-2 border-cute-deeppink text-cute-deeppink font-bold text-xs px-4 py-1.5 rounded-full uppercase tracking-wider inline-block">Writing Collection ✏️</span>
            <h1 class="text-4xl font-heading font-extrabold text-slate-900">Pastel Pens & Gel Markers 🌸</h1>
            <p class="text-slate-600 text-sm font-medium">Smooth, quick-drying pastel gel pens, highlighters, and fineliners.</p>
        </div>

        <div id="grid-pens" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="cart-drawer" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl border-l-4 border-cute-pink">
            <div>
                <div class="flex justify-between items-center border-b-2 border-cute-border pb-4">
                    <h3 class="text-2xl font-heading font-extrabold text-slate-900">Your Cart 🛒</h3>
                    <button onclick="toggleCartDrawer()" class="text-slate-400 font-extrabold text-xl">✕</button>
                </div>
                <div id="cart-items" class="py-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
            </div>
            <div class="border-t-2 border-cute-border pt-4 space-y-3">
                <div class="flex justify-between font-heading font-bold text-lg"><span>Total:</span><span id="cart-total">₱0.00</span></div>
                <button onclick="handleCheckout()" class="w-full bg-cute-deeppink text-white font-heading font-bold py-3.5 rounded-2xl hover:bg-cute-hotpink transition shadow-md">Proceed to Checkout 💳</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vlbtdmobfohoonzpflgq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QyXlBe0KPgctz8JrsJ6OKA_Ui1PPgex";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const items = [
            { id: "pen-1", title: "Sakura Blossom Gel Pens (6 Set)", price: 180.00, image_url: "https://images.unsplash.com/photo-1585336261026-67576887146d?w=500&auto=format&fit=crop&q=60", description: "0.5mm smooth black gel ink in quick-dry soft pastel barrels." },
            { id: "pen-2", title: "Soft Pastel Dual Highlighters (5 Pack)", price: 165.00, image_url: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=500&auto=format&fit=crop&q=60", description: "Chisel and fine tip double-ended aesthetic pastel markers." },
            { id: "pen-3", title: "Korean Macaron Retractable Gel Pens", price: 195.00, image_url: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=500&auto=format&fit=crop&q=60", description: "Super comfortable rubber grip gel pens with no smudging." },
            { id: "pen-4", title: "Vintage Pastel Fountain Pen Set", price: 290.00, image_url: "https://images.unsplash.com/photo-1585336261026-67576887146d?w=500&auto=format&fit=crop&q=60", description: "Includes fine nib fountain pen and 4 pastel color ink cartridges." },
            { id: "pen-5", title: "Matcha Mint Fine Line Fineliners (8 Set)", price: 210.00, image_url: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=500&auto=format&fit=crop&q=60", description: "0.38mm precise fineliners ideal for bullet journal lettering." },
            { id: "pen-6", title: "Peach Milkshake Ballpoint Trio", price: 125.00, image_url: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=500&auto=format&fit=crop&q=60", description: "Cute peach gradient bodies with ultra-smooth oil-based ink." }
        ];

        let cart = JSON.parse(localStorage.getItem('office_supply_cart') || '[]');

        document.addEventListener('DOMContentLoaded', () => { renderGrid(); updateCartUI(); });

        function renderGrid() {
            const container = document.getElementById('grid-pens');
            container.innerHTML = '';
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl border-4 border-cute-pink p-4 flex flex-col justify-between shadow-md hover:shadow-xl transition";
                card.innerHTML = `
                    <div class="space-y-3">
                        <img src="${p.image_url}" class="w-full h-48 object-cover rounded-2xl border-2 border-cute-border">
                        <h4 class="font-heading font-extrabold text-slate-900 text-lg">${p.title}</h4>
                        <p class="text-slate-500 text-xs font-medium">${p.description}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t-2 border-cute-border flex items-center justify-between">
                        <span class="text-lg font-black">₱${p.price.toFixed(2)}</span>
                        <button onclick="addToCart('${p.id}')" class="bg-cute-lightpink text-cute-deeppink border-2 border-cute-deeppink px-3 py-1.5 rounded-xl font-heading font-bold text-xs hover:bg-cute-deeppink hover:text-white transition">Add to Cart 🛒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(id) {
            const item = items.find(i => i.id === id);
            const idx = cart.findIndex(c => c.id === id);
            if (idx > -1) cart[idx].quantity += 1;
            else cart.push({ ...item, quantity: 1 });
            updateCartUI();
            toggleCartDrawer();
        }

        function toggleCartDrawer() { document.getElementById('cart-drawer').classList.toggle('hidden'); }

        function updateCartUI() {
            localStorage.setItem('office_supply_cart', JSON.stringify(cart));
            document.getElementById('cart-count').textContent = cart.reduce((acc, i) => acc + i.quantity, 0);
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach(i => {
                total += i.price * i.quantity;
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-cute-lightpink p-3 rounded-2xl border-2 border-cute-border">
                        <div><p class="font-heading font-bold text-xs">${i.title}</p><p class="text-xs font-black">₱${i.price} x ${i.quantity}</p></div>
                        <button onclick="removeFromCart('${i.id}')" class="text-xs font-bold text-red-500">Remove</button>
                    </div>`;
            });
            document.getElementById('cart-total').textContent = `₱${total.toFixed(2)}`;
        }

        function removeFromCart(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }

        async function handleCheckout() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = "auth.html";
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
