<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICESUPPLY. 🌸 - Edit Product</title>
    <!-- Google Fonts: Fredoka & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              fredoka: ['Fredoka', 'sans-serif'],
              quicksand: ['Quicksand', 'sans-serif'],
            },
            colors: {
              cute: {
                pink: '#FFAEC9',
                lightpink: '#FFF0F5',
                deeppink: '#FF69B4',
                hotpink: '#FF1493',
                border: '#FFD1DC'
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Fredoka', sans-serif; }
        .floral-bg {
            background-color: #FFF0F5;
            background-image: radial-gradient(#FFAEC9 0.75px, transparent 0.75px), radial-gradient(#FFAEC9 0.75px, #FFF0F5 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
    </style>
</head>
<body class="floral-bg text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-cute-pink text-slate-800 sticky top-0 z-40 shadow-md border-b-4 border-cute-deeppink">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="text-3xl font-heading font-extrabold tracking-wide text-white drop-shadow-[0_2px_2px_rgba(255,105,180,0.8)] flex items-center gap-2">
                🌸 OFFICESUPPLY. ✨
            </a>
            <a href="dashboard.html" class="bg-white text-cute-deeppink border-2 border-cute-deeppink px-4 py-1.5 rounded-full font-heading font-bold hover:bg-cute-deeppink hover:text-white transition text-xs">
                ← Back to Dashboard 🚪
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-2xl mx-auto px-6 py-10 flex-1 w-full">
        <div class="bg-white p-8 rounded-3xl border-4 border-cute-pink shadow-xl space-y-6">
            <div class="border-b-2 border-cute-border pb-4 flex justify-between items-center">
                <h2 class="text-2xl font-heading font-bold text-cute-deeppink">Edit Product Details ✏️</h2>
                <span id="loading-indicator" class="text-xs text-slate-400 font-bold">Loading...</span>
            </div>

            <form id="edit-form" onsubmit="handleSaveProduct(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Product Title 🌸</label>
                    <input type="text" id="edit-title" required class="w-full mt-1 p-3 border-2 border-cute-border rounded-2xl text-sm bg-cute-lightpink focus:outline-none focus:border-cute-deeppink">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Price (PHP) ₱</label>
                        <input type="number" step="0.01" id="edit-price" required class="w-full mt-1 p-3 border-2 border-cute-border rounded-2xl text-sm bg-cute-lightpink focus:outline-none focus:border-cute-deeppink">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Quantity 📦</label>
                        <input type="number" id="edit-qty" required min="0" class="w-full mt-1 p-3 border-2 border-cute-border rounded-2xl text-sm bg-cute-lightpink focus:outline-none focus:border-cute-deeppink">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Seller Location 📍</label>
                    <input type="text" id="edit-location" required class="w-full mt-1 p-3 border-2 border-cute-border rounded-2xl text-sm bg-cute-lightpink focus:outline-none focus:border-cute-deeppink">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Description 📝</label>
                    <textarea id="edit-desc" rows="3" class="w-full mt-1 p-3 border-2 border-cute-border rounded-2xl text-sm bg-cute-lightpink focus:outline-none focus:border-cute-deeppink"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-2">Product Photo 🖼️</label>
                    <div class="flex items-center gap-4 bg-cute-lightpink p-4 rounded-2xl border-2 border-cute-border">
                        <img id="edit-preview-img" src="" alt="Product Preview" class="w-20 h-20 object-cover rounded-xl border-2 border-cute-pink shadow-sm">
                        <div class="space-y-1">
                            <input type="file" id="edit-file" accept="image/*" onchange="previewNewImage(this)" class="text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-cute-deeppink file:text-white hover:file:bg-cute-hotpink transition cursor-pointer">
                            <p class="text-[10px] text-slate-400 font-medium">Select a file only if you wish to change the image.</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 pt-4 border-t border-slate-100">
                    <a href="dashboard.html" class="flex-1 text-center py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold text-sm hover:bg-slate-200 transition">
                        Cancel
                    </a>
                    <button type="submit" id="btn-save" class="flex-1 py-3 bg-cute-deeppink text-white rounded-2xl font-heading font-bold text-sm hover:bg-cute-hotpink transition shadow-md">
                        Save Changes ✨
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://vlbtdmobfohoonzpflgq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QyXlBe0KPgctz8JrsJ6OKA_Ui1PPgex";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let productId = null;
        let existingImageUrl = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Please log in first! 🌸");
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            // Extract 'id' parameter from URL query string
            const urlParams = new URLSearchParams(window.location.search);
            productId = urlParams.get('id');

            if (!productId) {
                alert("No product selected! Returning to dashboard.");
                window.location.href = 'dashboard.html';
                return;
            }

            fetchProductData();
        });

        async function fetchProductData() {
            const { data: product, error } = await supabaseClient
                .from('products')
                .select('*')
                .eq('id', productId)
                .eq('seller_id', currentUser.id)
                .single();

            if (error || !product) {
                alert("Could not load product or you do not have permission to edit it.");
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('edit-title').value = product.title || '';
            document.getElementById('edit-price').value = product.price || 0;
            document.getElementById('edit-qty').value = product.quantity ?? 1;
            document.getElementById('edit-location').value = product.location || '';
            document.getElementById('edit-desc').value = product.description || '';
            document.getElementById('edit-preview-img').src = product.image_url || '';
            
            existingImageUrl = product.image_url;
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        function previewNewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('edit-preview-img').src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function handleSaveProduct(event) {
            event.preventDefault();
            const saveBtn = document.getElementById('btn-save');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving Changes... 🌸';

            try {
                let finalImageUrl = existingImageUrl;
                const fileInput = document.getElementById('edit-file');

                // If user selected a new photo, upload it to storage
                if (fileInput.files.length > 0) {
                    const selectedFile = fileInput.files[0];
                    const fileExt = selectedFile.name.split('.').pop();
                    const filePath = `product-${currentUser.id}-${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from('products')
                        .upload(filePath, selectedFile, { upsert: true });

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('products')
                        .getPublicUrl(filePath);

                    finalImageUrl = publicUrlData.publicUrl;
                }

                // Update database row
                const updatedPayload = {
                    title: document.getElementById('edit-title').value,
                    price: parseFloat(document.getElementById('edit-price').value),
                    quantity: parseInt(document.getElementById('edit-qty').value, 10),
                    location: document.getElementById('edit-location').value,
                    description: document.getElementById('edit-desc').value,
                    image_url: finalImageUrl
                };

                const { error: updateError } = await supabaseClient
                    .from('products')
                    .update(updatedPayload)
                    .eq('id', productId)
                    .eq('seller_id', currentUser.id);

                if (updateError) throw updateError;

                alert("Product updated successfully! ✨🌸");
                window.location.href = 'dashboard.html';

            } catch (err) {
                alert("Failed to save product: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes ✨';
            }
        }
    </script>
</body>
</html>
